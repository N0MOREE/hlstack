[package]
name = "hl-replay"
version = "0.1.0"
edition = "2021"

[dependencies]
# zlib-ng 后端:纯 Rust 的 miniz_oxide 解压约慢 2-3 倍,而实测解压占总 CPU 的 20%。
flate2 = { version = "1.1.9", features = ["zlib-rs"], default-features = false }
# 注意:不要开 preserve_order。它强制每个 object 用 IndexMap 而非 BTreeMap,
# 多一份 Vec 分配;我们只读不写,保序没有任何用处。
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# 标准库 HashMap 用 SipHash-1-3(抗 HashDoS 的密码学哈希)。我们的键是 oid(u64) 和
# 地址字符串,输入不来自攻击者,用 FxHash 即可,小键上快 2-3 倍。
# 语义不变:所有依赖顺序的地方(sched/resolve_target/ro_trim)本来就显式排序过,
# difftest 会验这一点。
rustc-hash = "2"

[profile.release]
lto = true
codegen-units = 1
